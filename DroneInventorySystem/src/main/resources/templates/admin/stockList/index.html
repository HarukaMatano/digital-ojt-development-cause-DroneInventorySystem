<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}"
>
  <head>
    <title>InvenTrack</title>
  </head>

  <body>
    <div class="card shadow mb-4">
      <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">在庫一覧</h6>
      </div>
      
      <div class="card-body">
        <!-- 検索(作成中) -->
        <div class="search-container">
        	<form class="form-inline" method="post" th:action="@{'/admin/stockList/search'}" th:object="${StockInfoForm}">
    			<label for="searchTerm" class="mr-2"><u>検索条件</u></label>
    			<label for="searchTerm" class="mr-2">分類</label>
    			<select id="searchTerm" name="category" class="form-control mr-2">
        			<option value="">選択してください</option>
        			<option th:each="category : ${categoryInfoList}" 
          			th:value="${category.categoryName}" 
            		th:text="${category.categoryName}"></option>    
    			</select>
    
    		&nbsp;&nbsp;
    
    			<label for="searchTerm" class="mr-2">名称</label>
    			<select id="searchTerm" name="name" class="form-control mr-2">
        			<option value="">選択してください</option>
        			<option th:each="item : ${stockInfoListSearch}" 
            		th:value="${item.name}" 
            		th:text="${item.name}"></option>    
    			</select>
    
    		&nbsp;&nbsp;
    
    			<label for="searchTerm" class="mr-2">個数</label>
    			<input type="text" id="searchTerm" name="amount" class="form-control mr-2">
    			<select id="searchTerm" name="than" class="form-control mr-2">
        			<option value="">選択してください</option>
        			<option value="以上">以上</option>
        			<option value="以下">以下</option>    
    			</select>
                                    
    			<button type="submit" class="btn btn-primary">検索</button>
			</form>
 				
 				<!-- エラーメッセージの表示 -->
 				<div th:if="${errorMsg != null}" class="text-danger">
					 <p th:text="${errorMsg}"></p>
				</div>
        </div>
        
        &nbsp;
        
        <!-- 在庫情報テーブル -->
        <div class="table-responsive">
          <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
            <thead>
              <tr>
                <th>分類</th>
                <th>名称</th>
                <th>個数</th>
                <th>保管場所</th>
                <th>説明</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${stockInfoList}">
                <td th:text="${item.categoryinfo.categoryName}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.amount}"></td>
                <td th:text="${item.centerinfo.centerName}"></td>
                <td th:text="${item.description}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
