<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}"
>
  <head>
    <title>InvenTrack</title>
  </head>

  <body>
	<div class="card shadow mb-4">

		<div class="card-header py-3">
			<h6 class="m-0 font-weight-bold text-primary">削除(在庫センター情報)</h6>
		</div>

		<div class="card-body">
 			
			<!-- 在庫センター情報登録単票 -->
				
			<!-- エラーメッセージの表示 -->
 				<div th:if="${errorMsg != null}" class="text-danger">
					 <p th:text="${errorMsg}"></p>
				</div>
			
				<form class="form-inline" method="post" th:action="@{'/admin/centerInfo/update/deleted'}" th:object="${CenterInfoForm}">
					
					<table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
					
					<tr>
						<td>
							<label for="searchTerm" class="mr-2">在庫センターID</label>
						</td>
						<td>
 							 <input type="text" id="centerId" th:field="*{centerId}" class="form-control mr-2" readonly />
 						</td>
 					</tr>
 					
 					<tr>
						 <td>
 							<label for="searchTerm" class="mr-2">在庫センター名</label>
 						</td>
 						
 						<td>
							 <input type="text" id="centerId" th:field="*{centerName}" class="form-control mr-2" readonly />
						</td>
					</tr>	
						 
						 
					<tr>
						 <td>	 
							<label for="searchTerm" class="mr-2">郵便番号</label>
 						</td>
 						
 						<td>
							<input type="text" id="centerId" th:field="*{postCode}" class="form-control mr-2" readonly />
 						</td>
					</tr>
 					
 					
 					<tr>
						<td>
							<label for="searchTerm" class="mr-2">住所</label>
 						</td>
 						
 						<td>
							<input type="text" id="centerId" th:field="*{address}" class="form-control mr-2" readonly />
						</td>
					</tr>
 										
 					<tr>
						<td>
							<label for="searchTerm" class="mr-2">電話番号</label>
						</td>
 						
 						<td>
							<input type="text" id="centerId" th:field="*{phoneNumber}" class="form-control mr-2" readonly />
						</td>
					</tr>
 					
 					
 					<tr>
						 <td>
							<label for="searchTerm" class="mr-2">管理者名</label>
						</td>
 						
 						<td>
							<input type="text" id="centerId" th:field="*{managerName}" class="form-control mr-2" readonly />
						</td>
					</tr>
 					
 					
 					<tr>
						 <td>
							<label for="searchTerm" class="mr-2">稼働ステータス</label>
						</td>
 						
 						<td>
							<!-- 稼働中ラジオボタン -->
        					<input type="radio" name="operationalStatus" value="0" 
				            th:checked="${CenterInfoForm.operationalStatus == 0}" disabled  /> 稼働中
				        	<!-- 休止中ラジオボタン -->
				        	<input type="radio" name="operationalStatus" value="1" 
				            th:checked="${CenterInfoForm.operationalStatus == 1}" disabled  /> 休止中
						</td>
					</tr>
 					
 					<tr>
						 <td> 	
							<label for="searchTerm" class="mr-2">最大容量(m<sup>3</sup>)</label>
 						</td>
 						
 						<td> 					
							<input type="text" id="centerId" th:field="*{maxStorageCapacity}" class="form-control mr-2" readonly />
		            	</td>
					</tr>
 										
 					<tr>
						 <td> 						
							<label for="searchTerm" class="mr-2">現在容量(m<sup>3</sup>)</label>
 					 	 </td>
 							
 						 <td> 
							<input type="text" id="centerId" th:field="*{currentStorageCapacity}" class="form-control mr-2" readonly />
						 </td>
					</tr>
					
					
					<tr>
						 <td> 
							<label for="searchTerm" class="mr-2">備考</label>
						 </td>
 						
 						 <td> 
							<input type="text" id="centerId" th:field="*{notes}" class="form-control mr-2" readonly />
						 </td>
					</tr>

					</table>
					
					<button type="submit" class="btn btn-primary">削除</button>
					
					&ensp;&ensp;
					
 				</form>
			<br>
				<a href="/admin/centerInfo" class="btn">キャンセル</a>		

	</div>
  </body>
</html>
